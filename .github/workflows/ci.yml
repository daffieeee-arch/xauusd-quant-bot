name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xauusd-quant-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: xauusd-quant-bot/requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Unit / smoke tests
        run: python -m pytest tests/ -q --tb=short

      - name: Import guard
        run: python -c "from engine.config import AccountSpec, StrategyParams; from engine.strategies import SIGNALS; print(sorted(SIGNALS))"
